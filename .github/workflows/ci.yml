
name: SkyCare Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          if ! find . -type f -name '*.js' \
            -not -path './.git/*' | grep -q .; then
            echo "No standalone JavaScript files found."
          else
            find . -type f -name '*.js' \
              -not -path './.git/*' -print0 |
              while IFS= read -r -d '' file; do
                echo "Checking $file"
                node --check "$file" || exit 1
              done
          fi

  publish-image:
    needs: frontend-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nezoxidc/skycare-frontend:latest
            ghcr.io/nezoxidc/skycare-frontend:sha-${{ github.sha }}
