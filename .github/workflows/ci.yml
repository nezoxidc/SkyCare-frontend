
name: SkyCare Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          if ! find . -type f -name '*.js' \
            -not -path './.git/*' | grep -q .; then
            echo "No standalone JavaScript files found."
          else
            find . -type f -name '*.js' \
              -not -path './.git/*' -print0 |
              while IFS= read -r -d '' file; do
                echo "Checking $file"
                node --check "$file" || exit 1
              done
          fi

